model: glm-5.2
label:
  en_US: glm-5.2
  zh_Hans: glm-5.2
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    label:
      en_US: Temperature
      zh_Hans: 温度
    type: float
    required: false
    help:
      en_US: Temperature
      zh_Hans: 温度
    default: 1.0
    max: 2.0
    min: 0.0
  - name: top_p
    label:
      en_US: Top P
      zh_Hans: Top P
    type: float
    required: false
    help:
      en_US: Top P
      zh_Hans: Top P
    default: 0.95
    max: 1.0
    min: 0.0
  - name: top_k
    label:
      en_US: Top K
      zh_Hans: Top K
    type: int
    required: false
    help:
      en_US: Top K
      zh_Hans: Top K
    max: 128
    min: 0
  - name: max_tokens
    label:
      en_US: Max tokens
      zh_Hans: 最大回复 token 数
    type: int
    required: false
    help:
      en_US: Maximum tokens the model may generate. Thinking models spend reasoning tokens from this budget too.
      zh_Hans: 模型最多可生成的 token 数。思考模型同样从该预算消耗推理 token，过小会导致正文为空。
    default: 8192
    max: 262144
    min: 1
  - name: presence_penalty
    label:
      en_US: Presence penalty
      zh_Hans: 存在惩罚
    type: float
    required: false
    help:
      en_US: Presence penalty
      zh_Hans: 存在惩罚
    max: 2.0
    min: -2.0
  - name: frequency_penalty
    label:
      en_US: Frequency penalty
      zh_Hans: 频率惩罚
    type: float
    required: false
    help:
      en_US: Frequency penalty
      zh_Hans: 频率惩罚
    max: 2.0
    min: -2.0
  - name: repetition_penalty
    label:
      en_US: Repetition penalty
      zh_Hans: 重复惩罚
    type: float
    required: false
    help:
      en_US: Penalize repeated tokens (higher discourages repetition)
      zh_Hans: 数值越大越抑制重复内容
    max: 2.0
    min: 0.0
  - name: min_p
    label:
      en_US: Min P
      zh_Hans: 最小概率截断
    type: float
    required: false
    help:
      en_US: Minimum probability threshold for token filtering
      zh_Hans: 按概率下限过滤候选 token
    max: 1.0
    min: 0.0
  - name: seed
    label:
      en_US: Seed
      zh_Hans: 随机种子
    type: int
    required: false
    help:
      en_US: Seed for deterministic sampling
      zh_Hans: 固定随机种子以获得可复现输出
  - name: stop
    label:
      en_US: Stop sequences
      zh_Hans: 停止序列
    type: tag-input
    required: false
    help:
      en_US: Up to 4 sequences where generation stops
      zh_Hans: 最多 4 个停止序列
  - name: response_format
    label:
      en_US: Response format
      zh_Hans: 回复格式
    type: string
    required: false
    help:
      en_US: Specify the format the model must output: plain text or JSON object
      zh_Hans: 指定模型必须输出的格式：纯文本或 JSON 对象
    default: text
    options:
      - text
      - json_object
  - name: reasoning_effort
    label:
      en_US: Reasoning effort
      zh_Hans: 推理力度
    type: string
    required: false
    help:
      en_US: Thinking depth for reasoning models. Lower saves tokens; GLM-5.3/Flash cannot disable thinking.
      zh_Hans: 推理模型的思考深度。档位越低越省 token；GLM-5.3/Flash 思考不可关闭，只能调档。
    default: high
    options:
      - high
      - xhigh
pricing:
  input: '8.00'
  output: '28.00'
  unit: '0.000001'
  currency: CNY
