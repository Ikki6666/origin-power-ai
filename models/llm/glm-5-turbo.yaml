model: glm-5-turbo
label:
  en_US: glm-5-turbo
  zh_Hans: glm-5-turbo
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 202752
parameter_rules:
  - name: temperature
    label:
      en_US: Temperature
      zh_Hans: 温度
    type: float
    required: false
    help:
      en_US: Temperature
      zh_Hans: 温度
    default: 1.0
    max: 2.0
    min: 0.0
  - name: top_p
    label:
      en_US: Top P
      zh_Hans: Top P
    type: float
    required: false
    help:
      en_US: Top P
      zh_Hans: Top P
    default: 0.95
    max: 1.0
    min: 0.0
  - name: top_k
    label:
      en_US: Top K
      zh_Hans: Top K
    type: int
    required: false
    help:
      en_US: Top K
      zh_Hans: Top K
    max: 128
    min: 0
  - name: max_tokens
    label:
      en_US: Max tokens
      zh_Hans: 最大回复 token 数
    type: int
    required: false
    help:
      en_US: Maximum tokens the model may generate. Thinking models spend reasoning tokens from this budget too.
      zh_Hans: 模型最多可生成的 token 数。思考模型同样从该预算消耗推理 token，过小会导致正文为空。
    default: 8192
    max: 131072
    min: 1
  - name: response_format
    label:
      en_US: Response format
      zh_Hans: 回复格式
    type: string
    required: false
    help:
      en_US: "Specify the format the model must output: plain text or JSON object"
      zh_Hans: 指定模型必须输出的格式：纯文本或 JSON 对象
    default: text
    options:
      - text
      - json_object
pricing:
  input: '7.00'
  output: '26.00'
  unit: '0.000001'
  currency: CNY
