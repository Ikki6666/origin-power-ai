model: glm-5-turbo
label:
  en_US: glm-5-turbo
  zh_Hans: glm-5-turbo
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    required: false
    default: 4096
    min: 1
    max: 131072
pricing:
  input: '7.00'
  output: '26.00'
  unit: '0.000001'
  currency: CNY
