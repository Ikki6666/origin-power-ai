model: glm-5.3-flash
label:
  en_US: glm-5.3-flash
  zh_Hans: glm-5.3-flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1280000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    required: false
    default: 4096
    min: 1
    max: 131072
pricing:
  input: '0.40'
  output: '1.40'
  unit: '0.000001'
  currency: CNY
