model: minimax-h3
label:
  en_US: minimax-h3
  zh_Hans: minimax-h3
model_type: llm
features:
  - agent-thought
  - vision
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    required: false
    default: 4096
    min: 1
    max: 131072
